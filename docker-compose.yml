# Bagent RAG —— 本地/单机部署编排
# 用法：docker compose up -d --build
# 前置：确保 ./models 下已缓存 bge 与 reranker 权重（脚本 scripts/download_models.py + reranker）。
#       若未缓存，去掉 app 服务的 HF_HUB_OFFLINE=1 让其首次联网下载。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-root}
      POSTGRES_DB: bagent_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bagent_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"   # 宿主机用 5433 访问，避免与本机 5432 冲突

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_HOST: db            # 容器内指向 db 服务
      PG_PORT: "5432"
      PG_DATABASE: bagent_rag
      HF_HOME: /app/models
      HF_HUB_OFFLINE: "1"    # 已挂载权重则离线；首次下载请临时去掉
      RETRIEVAL_MODE: hybrid
      RERANK_ENABLED: "true"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    ports:
      - "8000:8000"

volumes:
  pgdata:
