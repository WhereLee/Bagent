# Bagent 子路径反代片段（放到 443/8443 的 server 块内）
#
# 前提：应用以 `--root-path /bagent` 启动（见 deploy/systemd/bagent.service），
#       nginx 的 proxy_pass 尾部斜杠会剥掉 /bagent/ 前缀，再由 root_path 还原文档 URL。
#
# 对外：
#   https://<host>:8443/bagent/health
#   https://<host>:8443/bagent/docs
#
# 注意：
# - 路径必须用 ^~，否则会被同 server 块里的 location / 截走。
# - 关闭 proxy_buffering 以支持 SSE 流式响应。
# - 修改后先 `nginx -t` 再 reload；备份文件不要放在 sites-enabled 目录，
#   否则会被 nginx 一并加载，造成同端口重复 server 块。

location ^~ /bagent/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host:$server_port;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 120s;
}
