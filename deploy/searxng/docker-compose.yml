# 自托管 SearXNG（供 Bagent 联网检索）。零 API key，成本=运维+扛上游限流。
# 起： docker compose up -d   ；验证： curl "http://127.0.0.1:8080/search?q=秦惠文王&format=json&engines=baidu"
# 注意：只绑 127.0.0.1（它能出网，别公网裸奔）；首次起后需按 README 补 baidu 引擎文件并开 JSON。
services:
  redis:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # 仅本机可达；Bagent 经 http://127.0.0.1:8080 调
    volumes:
      - ./searxng:/etc/searxng:rw
      # - ./engines:/usr/local/searxng/searx/engines:rw   # 补 baidu 引擎文件时启用（见 README）
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - UWSGI_WORKERS=2            # 4G 机器保守值
      - UWSGI_THREADS=4
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options: { max-size: "1m", max-file: "1" }
