name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies (CPU torch to avoid CUDA bloat)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Syntax / import compile check
        run: python -m compileall -q app scripts
      - name: Unit tests (hermetic, no DB/model)
        run: pytest -q -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    # 真实 PostgreSQL + pgvector 服务容器，跑端到端检索/增量回归
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bagent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: bagent_ci
      RETRIEVAL_MODE: hybrid
      RERANK_ENABLED: "false"          # 集成测只验 dense/hybrid(BM25+RRF) 路径，避免 1.1G reranker 拖慢 CI
      RETRIEVAL_CACHE_ENABLED: "false" # 关掉缓存保证每次都真跑检索
      HF_ENDPOINT: https://huggingface.co  # runner 在海外，用官方 HF（非国内镜像）拉 embedding
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run integration tests (real pgvector + bge embedding)
        run: pytest -q -m integration

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交到仓库，密钥有泄露风险"; exit 1
          fi
          echo "OK: .env 未被跟踪"
      - name: Scan tracked files for key/token patterns
        run: |
          if git grep -nEI 'sk-[A-Za-z0-9]{16,}|BEGIN (RSA|OPENSSH) PRIVATE KEY' -- ':!*.md'; then
            echo "::error::在跟踪的文件中发现疑似密钥串"; exit 1
          fi
          echo "OK: 未发现密钥模式"

  docker-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bagent-rag:ci .
      - name: Smoke (image metadata only, 需 DB/模型才能起服务)
        run: docker image inspect bagent-rag:ci --format '{{.Config.Cmd}}'
